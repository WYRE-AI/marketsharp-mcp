name: a write tool called by name is refused when MARKETSHARP_ENABLE_WRITES is off
server:
  command: node
  args: [dist/index.js]
  env:
    MARKETSHARP_COMPANY_ID: "123"
    MARKETSHARP_API_KEY: eval-key-not-real-0000
    MARKETSHARP_API_SECRET: eval-secret-not-real-0000
assert:
  tool: marketsharp_contact_notes_create
  args:
    contactId: c1
    note: eval
  expect:
    is_error: true
    contains: ["turned off"]
timeout: 30s
